[ui.profiles.arc]
extends = "developer"
density = "compact"
show_commands = "on-error"
show_completed_steps = true

[targets.arc]
runner = "python"
platform = "cli"
root = "."
execution_environment = "native-termux"
inputs = [
  "src/**",
  "tests/**",
  "scripts/**",
  "pyproject.toml",
  ".devtool.toml",
  "devtoolw",
  "devtoolw.cmd",
  "completions/**",
  "docs/**",
  "release/**",
  "README.md",
  "CONTRIBUTING.md",
]
outputs = [
  "dist/**",
  ".devtool/reports/**",
  ".devtool/evidence/**",
  ".devtool/build-artifacts/**",
]

[targets.arc.artifacts]
output_directory = ".devtool/build-artifacts"
collision = "unique"
verify = true
directories = ["dist"]
patterns = ["*.whl", "*.tar.gz"]
recursive = false

[targets.arc.jobs.syntax]
runner = "command"
command = ["python3", "-m", "compileall", "-q", "src", "tests", "scripts"]
inputs = ["src/**", "tests/**", "scripts/**"]
metadata = { read_only = true, purpose = "syntax", contract = "arc-devtool-v2" }

[targets.arc.jobs.final-gate]
runner = "command"
command = ["python3", "scripts/run_final_gate_tests.py"]
inputs = [
  "src/**",
  "tests/**",
  "scripts/**",
  "release/**",
  "docs/**",
  "pyproject.toml",
  "MANIFEST.in",
  ".devtool.toml",
  "completions/_arc",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "devtoolw",
  "devtoolw.cmd",
]
outputs = [".devtool/evidence/arc-final-gate/**"]
metadata = { read_only = false, purpose = "arc-r01-r12-final-gate", contract = "arc-final-gate-v4" }

