[project]
runner = "python"
platform = "cli"
root = "."
python = "python3"
run_command = "python -m arc_cli --help"

[workspace]
default_target = "arc"

[workspace.scheduler]
parallel = true
max_parallel_nodes = 3
max_gradle_nodes = 1
max_dotnet_nodes = 1

[toolchain]
manager = "none"

[python]
manager = "venv"
environment = ".devtool/venvs/arc"
test_framework = "pytest"
extras = ["test"]
locked = false
offline = false
install_project = true
isolation = true
disable_network = false
lint = []
validator_dependencies = ["build>=1.2"]
pre_commit = false
source_import_isolation = true
cli_contract = true
matrix = ["3.11", "3.12", "3.13", "3.14"]
matrix_mode = "active"
fresh_dist = true
clean_categories = ["artifacts", "caches", "environments"]

[python.pytest]
tests = ["tests"]
args = ["-ra", "--maxfail=1"]
include_defaults = false

[python.package]
verify_all_wheels = true
rebuild_sdist = true
import_smoke = true
verify_cli = true
install_dependencies = true
reproducible = true
import_modules = ["arc_cli"]
console_scripts = ["arc", "arcmk", "arc-create", "arcpack", "arcx", "arc-extract", "arcunpack", "arcls", "arc-list", "arci", "arc-info", "arcdiff", "arc-diff", "arct", "arc-test", "arccheck", "arccv", "arc-convert", "arcconvert", "arca", "arc-add", "arcu", "arc-update", "arcrm", "arc-remove", "arcbe", "arc-backends", "arc-formats", "arcp", "arc-profiles"]

[python.security]
enabled = false
sbom = true

[validation]
test_profile = "full"

[test_profiles.quick]
pytest_tests = [
  "tests/test_formats.py",
  "tests/test_filtering.py",
  "tests/test_completion.py",
]
pytest_args = ["--maxfail=1"]
pytest_include_defaults = false

[test_profiles.integration]
pytest_tests = [
  "tests/test_cli_integration.py",
  "tests/test_safety.py",
]
pytest_args = ["--maxfail=1"]
pytest_include_defaults = false

[test_profiles.full]
pytest_tests = ["tests"]
pytest_args = ["--maxfail=1"]
pytest_include_defaults = false

[test_profiles.final_gate]
pytest_tests = ["tests"]
