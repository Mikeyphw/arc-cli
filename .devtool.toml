[wrapper]
schema = 1
default_command = "check"

[wrapper.commands.setup]
description = "Create/synchronize the Devtool-managed host-Python environment"
devtool = "restore"
target = "arc"
allow_passthrough = true

[wrapper.commands.build]
description = "Build arc-cli through Devtool's Python runner"
devtool = "build"
target = "arc"
allow_passthrough = true
aliases = ["b"]

[wrapper.commands.test]
description = "Run pytest through Devtool with native test selection"
devtool = "test"
target = "arc"
allow_passthrough = true
aliases = ["t"]

[wrapper.commands.test.options.profile]
type = "choice"
description = "Select a repository test profile"
choices = ["quick", "integration", "r04", "r05", "r06", "r07", "r08", "r09a", "r09b", "r09b_gate", "r10", "r10a", "r10b", "r10c", "r10_gate", "r11", "r11a", "r11b", "r11_gate", "r12", "r12a", "r12_gate", "final_gate", "full"]
command_argv = ["--profile", "{value}"]

[wrapper.commands.test.options.node]
type = "string"
description = "Run an exact pytest node id; repeatable"
repeatable = true
command_argv = ["--pytest-test", "{value}"]

[wrapper.commands.test.options.failed]
type = "boolean"
description = "Re-run previously failed tests"
command_argv = ["--failed"]

[wrapper.commands.test.options.changed]
type = "boolean"
description = "Select tests affected by Git changes"
command_argv = ["--changed"]

[wrapper.commands.test.options.list]
type = "boolean"
description = "List collected tests without executing them"
command_argv = ["--list-tests"]

[wrapper.commands.lint]
description = "Run Termux system Ruff checks plus completion/Devtool contracts"
workflow = "lint"
target = "arc"
aliases = ["l"]

[wrapper.commands.format]
description = "Apply Termux system Ruff formatting and safe fixes"
workflow = "format"
target = "arc"
aliases = ["fmt"]

[wrapper.commands.check]
description = "Run the authoritative arc-cli quality DAG"
workflow = "quality"
target = "arc"
aliases = ["verify", "v"]

[wrapper.commands.validate]
description = "Run Devtool's native Python validation pipeline"
devtool = "validate"
target = "arc"
allow_passthrough = true
aliases = ["val"]

[wrapper.commands.validate.options.profile]
type = "choice"
description = "Select the validation test profile"
choices = ["quick", "integration", "r04", "r05", "r06", "r07", "r08", "r09a", "r09b", "r09b_gate", "r10", "r10a", "r10b", "r10c", "r10_gate", "r11", "r11a", "r11b", "r11_gate", "r12", "r12a", "r12_gate", "final_gate", "full"]
command_argv = ["--test-profile", "{value}"]

[wrapper.commands.validate.options.affected]
type = "boolean"
description = "Scope validation to Git-affected ownership"
global_argv = ["--affected"]

[wrapper.commands.validate.options.failed]
type = "boolean"
description = "Re-run previously failed tests inside validation"
command_argv = ["--failed"]

[wrapper.commands.validate.options.changed]
type = "boolean"
description = "Select tests related to changed files"
command_argv = ["--changed"]

[wrapper.commands.package]
description = "Build and verify distributable wheel/sdist artifacts"
devtool = "package"
target = "arc"
allow_passthrough = true
aliases = ["pkg"]

[wrapper.commands.package.options.output]
type = "path"
description = "Copy verified package artifacts to this directory"
relative_to = "cwd"
command_argv = ["--output-dir", "{value}"]

[wrapper.commands.package.options.name]
type = "string"
description = "Override the managed artifact base name"
command_argv = ["--output-name", "{value}"]

[wrapper.commands.package.options.collision]
type = "choice"
description = "Choose managed artifact collision handling"
choices = ["unique", "replace", "fail"]
command_argv = ["--artifact-collision", "{value}"]

[wrapper.commands.clean]
description = "Clean Devtool-managed Python artifacts, caches, and environments"
devtool = "clean"
target = "arc"
allow_passthrough = true

[wrapper.commands.fast]
description = "Run the fast EXO DAG: restore, Ruff check, tests, completion, backend smoke"
workflow = "fast"
target = "arc"
aliases = ["f"]

[wrapper.commands.quality]
description = "Run system Ruff, tests, contracts, and backend smoke"
workflow = "quality"
target = "arc"
aliases = ["q"]

[wrapper.commands.gate]
description = "Run the cumulative ARC-R01 through ARC-R12 qualification gate"
workflow = "final_gate"
target = "arc"
aliases = ["g"]

[wrapper.commands.seal]
description = "Run the final ARC-R01 through ARC-R12 gate, Devtool wrapper seal, exact content seal, SEALED verdict, and final integrity check"
workflow = "final_seal"
target = "arc"
aliases = ["s"]

[wrapper.commands.r06]
description = "Run ARC-R06 runtime, alias, and installation truth qualification"
workflow = "r06"
target = "arc"

[wrapper.commands.r07]
description = "Run ARC-R07 explain/recovery/resumable-batch targeted validation"
workflow = "r07"
target = "arc"

[wrapper.commands.r08]
description = "Run ARC-R08 machine/capability/verification targeted validation"
workflow = "r08"
target = "arc"

[wrapper.commands.r09a]
description = "Run ARC-R09A logical fingerprint/provenance/diff targeted validation"
workflow = "r09a"
target = "arc"

[wrapper.commands.r09b]
description = "Run ARC-R09B remote capability/cache/publication targeted validation"
workflow = "r09b"
target = "arc"

[wrapper.commands.r09b-gate]
description = "Run the cumulative ARC-R09B remote capability/publication qualification gate"
workflow = "r09b_gate"
target = "arc"

[wrapper.commands.r10]
description = "Run ARC-R10 destructive-policy and semantic-progress targeted validation"
workflow = "r10"
target = "arc"

[wrapper.commands.r10a]
description = "Run ARC-R10A backend-command truth targeted validation"
workflow = "r10a"
target = "arc"

[wrapper.commands.r10b]
description = "Run ARC-R10B machine-batch schema and execution validation"
workflow = "r10b"
target = "arc"

[wrapper.commands.r10c]
description = "Run ARC-R10C mutation-policy convergence and recoverability validation"
workflow = "r10c"
target = "arc"

[wrapper.commands.r10-gate]
description = "Run the cumulative ARC-R10 mutation policy/command truth/machine batch qualification gate"
workflow = "r10_gate"
target = "arc"

[wrapper.commands.r11]
description = "Run ARC-R11 configuration provenance and explainability validation"
workflow = "r11"
target = "arc"

[wrapper.commands.r11a]
description = "Run ARC-R11A configuration diagnostic convergence validation"
workflow = "r11a"
target = "arc"

[wrapper.commands.r11b]
description = "Run ARC-R11B doctor invalid-environment isolation validation"
workflow = "r11b"
target = "arc"

[wrapper.commands.r11-gate]
description = "Run the cumulative ARC-R11 configuration provenance and diagnostic qualification gate"
workflow = "r11_gate"
target = "arc"

[wrapper.commands.r12]
description = "Run ARC-R12 advisory, benchmark, and diagnostics validation"
workflow = "r12"
target = "arc"

[wrapper.commands.r12a]
description = "Run ARC-R12A benchmark corpus truth convergence validation"
workflow = "r12a"
target = "arc"

[wrapper.commands.r12-gate]
description = "Run the cumulative ARC-R12 final campaign qualification gate"
workflow = "r12_gate"
target = "arc"

[wrapper.commands.refresh-install]
description = "Regenerate Arc metadata surfaces and refresh the active editable install"
workflow = "refresh_install"
target = "arc"
aliases = ["refresh"]

[wrapper.commands.release]
description = "Run validation, verified packaging, smoke, SBOM, and release evidence"
workflow = "release"
target = "arc"
aliases = ["rel"]
